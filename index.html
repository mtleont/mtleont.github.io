<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Win95 Site</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {}
  }
  </script>
</head>
<body>
  <div id="site">
    <header class="topbar">
      <div class="brand">Win95 Style</div>
      <nav class="nav-buttons" role="navigation" aria-label="Sections">
        <button class="nav-btn task-item active" data-route="#/home">Home</button>
        <button class="nav-btn task-item" data-route="#/about">About</button>
        <button class="nav-btn task-item" data-route="#/contact">Contact</button>
      </nav>
    </header>

    <main id="content" class="content-area" role="main">
      <!-- App content injected here -->
    </main>

    <footer class="statusbar" id="statusbar">Ready</footer>
  </div>

  <template id="tmpl-home">
    <div class="page">
      <h1>Welcome</h1>
      <p>This is a Windows 95 themed site. Use the taskbar or links to navigate.</p>
      <p><a href="#/about" class="link">About</a> · <a href="#/contact" class="link">Contact</a></p>
    </div>
  </template>

  <template id="tmpl-about">
    <div class="page">
      <h1>About</h1>
      <p>This site is styled like Windows 95. It's a small single-page app with pages loaded by hash routing.</p>
    </div>
  </template>

  <template id="tmpl-contact">
    <div class="page">
      <h1>Contact</h1>

      <div class="contact-info" style="margin-bottom:12px">
        <p style="margin:4px 0"><strong>Company:</strong> Retro Widgets Inc.</p>
        <p style="margin:4px 0"><strong>Phone:</strong> (555) 019-4590</p>
        <p style="margin:4px 0"><strong>Email:</strong> <a href="mailto:hello@retrowidgets.example" class="link">hello@retrowidgets.example</a></p>
        <p style="margin:4px 0"><strong>Address:</strong> 123 Vintage Ave, Suite 95, Nostalgia City</p>
        <p style="margin:4px 0"><strong>Hours:</strong> Mon–Fri 9:00 — 17:00</p>
      </div>
    </div>
  </template>



  <script src="app.js" type="module"></script>
</body>
</html>
