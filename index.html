<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTLEONT DEVELOPMENT</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem;
        }

        .logo {
            width: 120px;
            height: auto;
        }

        .status {
            font-size: 1.1rem;
        }

        header {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
            border-radius: 10px;
        }

        .headerbtn {
            display: flex;
            justify-content: center;
            align-items: center;

            min-width: 140px;
            height: 50px;

            background-color: rgb(0, 136, 255);
            color: white;
            text-decoration: none;

            border-radius: 8px;

            transition: transform 0.15s ease,
                        background-color 0.15s ease;
        }

        .headerbtn:hover {
            background-color: rgb(0, 115, 215);
            transform: translateY(-2px);
        }

        .headerbtn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="content">
        <img src="logo.png" alt="MTLEONT DEVELOPMENT Logo" class="logo">

        <h1>MTLEONT DEVELOPMENT</h1>
        <p class="status">🚧 Under Construction</p>

        <header>
            <a href="/" class="headerbtn">Main Page</a>
            <a href="realos/" class="headerbtn">Download RealOS</a>
            <a href="about.html" class="headerbtn">About</a>
        </header>
    </div>
</body>
</html>
