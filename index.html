<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTLEONT DEVELOPMENT</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #c0c0c0;
            min-height: 100vh;
        }

        .content {
            padding: 30px;
            max-width: 960px;
            margin: 0 auto;
        }

        .logo {
            width: 250px;
            height: auto;
            display: block;
        }

        h1 {
            font-size: 48px;
            margin: 30px 0 20px 0;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .status {
            font-size: 28px;
            color: #555;
            font-weight: bold;
            margin: 0 0 40px 0;
        }

        header {
            width: 100%;
            height: 80px;
            background: #0000aa;
            color: white;
            padding: 0 30px;
            box-sizing: border-box;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        .headerbtn {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid white;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .headerbtn:hover {
            background: #000080;
        }

        button {
            background: #c0c0c0;
            border: 3px solid #808080;
            color: black;
            padding: 10px 20px;
            border-radius: 0;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        button:hover {
            background: #d0d0d0;
        }

        button:active {
            border: 3px inset #808080;
        }
    </style>
</head>
<body>
    <div class="content">
        <img src="logo.png" alt="MTLEONT DEVELOPMENT Logo" class="logo">

        <h1>MTLEONT DEVELOPMENT</h1>
        <p class="status">🚧 Under Construction</p>

        <header>
            <a href="/" class="headerbtn">Main Page</a>
            <a href="realos/" class="headerbtn">Download RealOS</a>
            <a href="about.html" class="headerbtn">About</a>
        </header>
    </div>
</body>
</html>
