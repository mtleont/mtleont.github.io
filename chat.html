<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OBS YouTube Chat Overlay</title>

  <style>
    /* IMPORTANT: OBS transparency */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Chat container */
    #chat {
      position: absolute;
      bottom: 0;
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
      box-sizing: border-box;
    }

    /* Message style */
    .msg {
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 8px;

      background: rgba(0, 0, 0, 0.55);
      color: white;

      font-size: 16px;
      line-height: 1.3;

      /* smooth appearance */
      animation: fadeIn 0.25s ease-in-out;
    }

    .user {
      color: #4fc3f7;
      font-weight: bold;
      margin-right: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div id="chat"></div>

<script>
const params = new URLSearchParams(window.location.search);
const streamInput = params.get("stream");
const API_KEY = params.get("key");

const chatBox = document.getElementById("chat");

if (!streamInput || !API_KEY) {
  throw new Error("Missing ?stream= and/or ?key=");
}

function extractVideoId(input) {
  if (!input) return null;
  if (!input.includes("http")) return input;

  try {
    const url = new URL(input);
    if (url.hostname.includes("youtu.be")) {
      return url.pathname.slice(1);
    }
    return url.searchParams.get("v");
  } catch {
    return null;
  }
}

const videoId = extractVideoId(streamInput);

if (!videoId) {
  throw new Error("Invalid video ID");
}

let liveChatId = null;
let nextPageToken = null;

async function fetchLiveChatId() {
  const url =
    `https://www.googleapis.com/youtube/v3/videos` +
    `?part=liveStreamingDetails&id=${videoId}&key=${API_KEY}`;

  const res = await fetch(url);
  const data = await res.json();

  const chatId = data.items?.[0]?.liveStreamingDetails?.activeLiveChatId;

  if (!chatId) {
    throw new Error("No active live chat (stream not live?)");
  }

  return chatId;
}

function addMessage(name, text) {
  const div = document.createElement("div");
  div.className = "msg";

  div.innerHTML = `<span class="user">${name}</span>${text}`;

  chatBox.appendChild(div);

  // limit messages (prevents lag in OBS over time)
  if (chatBox.children.length > 30) {
    chatBox.removeChild(chatBox.firstChild);
  }
}

async function pollChat() {
  try {
    const url =
      `https://www.googleapis.com/youtube/v3/liveChat/messages` +
      `?liveChatId=${liveChatId}` +
      `&part=snippet,authorDetails` +
      `&pageToken=${nextPageToken || ""}` +
      `&key=${API_KEY}`;

    const res = await fetch(url);
    const data = await res.json();

    if (data.items) {
      for (const msg of data.items) {
        addMessage(
          msg.authorDetails.displayName,
          msg.snippet.displayMessage
        );
      }
    }

    nextPageToken = data.nextPageToken;

    setTimeout(
      pollChat,
      data.pollingIntervalMillis || 2000
    );
  } catch (err) {
    console.error(err);

    // retry after error
    setTimeout(pollChat, 5000);
  }
}

(async function init() {
  liveChatId = await fetchLiveChatId();
  pollChat();
})();
</script>

</body>
</html>
