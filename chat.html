<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Live Chat Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      padding: 6px;
      border-bottom: 1px solid #222;
    }

    .user {
      color: #4fc3f7;
      font-weight: bold;
    }

    #status {
      padding: 8px;
      background: #222;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div id="status">Initializing...</div>
<div id="chat"></div>

<script>
const params = new URLSearchParams(window.location.search);
const streamInput = params.get("stream");
const API_KEY = params.get("key");

const chatBox = document.getElementById("chat");
const statusBox = document.getElementById("status");

if (!streamInput || !API_KEY) {
  statusBox.innerText = "Missing ?stream= and/or ?key=";
  throw new Error("Missing params");
}

// Extract video ID from URL or raw ID
function extractVideoId(input) {
  if (!input) return null;

  // already a video ID
  if (!input.includes("http")) return input;

  try {
    const url = new URL(input);
    if (url.hostname.includes("youtu.be")) {
      return url.pathname.slice(1);
    }
    return url.searchParams.get("v");
  } catch {
    return null;
  }
}

const videoId = extractVideoId(streamInput);

if (!videoId) {
  statusBox.innerText = "Invalid stream/video URL";
  throw new Error("Bad stream input");
}

let liveChatId = null;
let nextPageToken = null;

// Step 1: Get liveChatId
async function fetchLiveChatId() {
  const url = `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${API_KEY}`;

  const res = await fetch(url);
  const data = await res.json();

  const chatId = data.items?.[0]?.liveStreamingDetails?.activeLiveChatId;

  if (!chatId) {
    throw new Error("No active live chat found (is stream live?)");
  }

  return chatId;
}

// Step 2: Poll chat messages
async function pollChat() {
  const url =
    `https://www.googleapis.com/youtube/v3/liveChat/messages` +
    `?liveChatId=${liveChatId}` +
    `&part=snippet,authorDetails` +
    `&pageToken=${nextPageToken || ""}` +
    `&key=${API_KEY}`;

  const res = await fetch(url);
  const data = await res.json();

  if (data.items) {
    for (const msg of data.items) {
      const div = document.createElement("div");
      div.className = "msg";

      const name = msg.authorDetails.displayName;
      const text = msg.snippet.displayMessage;

      div.innerHTML = `<span class="user">${name}:</span> ${text}`;
      chatBox.appendChild(div);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  nextPageToken = data.nextPageToken;
  const wait = data.pollingIntervalMillis || 2000;

  setTimeout(pollChat, wait);
}

// Boot
(async function init() {
  try {
    statusBox.innerText = "Fetching live chat ID...";

    liveChatId = await fetchLiveChatId();

    statusBox.innerText = "Connected to live chat ✔";

    pollChat();
  } catch (err) {
    console.error(err);
    statusBox.innerText = "Error: " + err.message;
  }
})();
</script>

</body>
</html>
